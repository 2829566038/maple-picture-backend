server:
  port: 8123
  servlet:
    context-path: /api

# 数据库配置
spring:
  servlet:
    multipart:
      # 更改单个文件最大大小
      max-file-size: 10MB
      # 总请求大小
      max-request-size: 10MB
      # 启用 multipart 处理
      enabled: true
  application:
    name: Maple
  datasource:
    url: jdbc:mysql://localhost:3306/maple_picture?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Redis 参数
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000

  profiles:
   active: local
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
      db-config:
        logic-delete-field: isDelete # 逻辑删除字段名
        logic-delete-value: 1 # 逻辑删除值
        logic-not-delete-value: 0 # 逻辑未删除值
# Knife4j 配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.maple.maple.controller

